name: TLL Compiler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bootstrap compiler dependencies
        working-directory: tll-compiler
        run: npm install

      - name: Build bootstrap compiler (TypeScript)
        working-directory: tll-compiler
        run: npm run build

      - name: Verify build artifacts exist
        shell: bash
        run: |
          test -f tll-compiler/dist/src/cli.js || (echo "cli.js not found" && exit 1)
          test -f tll-compiler/dist/src/runtime.js || (echo "runtime.js not found" && exit 1)
          echo "Build artifacts verified"

      - name: Run unified test suite
        working-directory: tll-bootstrap
        run: node tests/run_all.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run self-hosting verification (ubuntu only - long running)
        if: matrix.os == 'ubuntu-latest'
        working-directory: tll-bootstrap
        run: node tests/selfhost.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "TLL CI Complete (${{ matrix.os }})"
          echo "========================================"
          echo "Build: TypeScript bootstrap compiler"
          echo "Tests: Unified test suite (VM/equivalence/exception/package/CLI)"
          echo "Self-host: L4+L5+determinism (ubuntu only)"
          echo "========================================"
