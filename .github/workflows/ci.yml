name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install
      - name: Build bootstrap
        run: npm run build-bootstrap
      - name: Generate compiler bytecode
        run: npm run gen-compiler-bc
      - name: Run tests
        run: npm test
      - name: Self-host verification
        run: npm run selfhost
