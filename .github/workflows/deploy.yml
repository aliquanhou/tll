name: Deploy Website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "website/*"
          target: "/var/www/tll.knitoem.com/"
          strip_components: 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Deployment completed at $(date)"
            ls -la /var/www/tll.knitoem.com/
            curl -s -o /dev/null -w "Homepage: HTTP %{http_code}\n" https://tll.knitoem.com/
            curl -s -o /dev/null -w "Docs: HTTP %{http_code}\n" https://tll.knitoem.com/docs/
            curl -s -o /dev/null -w "Playground: HTTP %{http_code}\n" https://tll.knitoem.com/playground/
