<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLL Playground</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--cyan:#00d4ff;--purple:#7b2ffc;--green:#00ff88;--red:#ff6b6b;--bg:#0a0e17;--bg2:#0f1420;--text:#e8edf5;--muted:#8892a6;--code-bg:#1a1f2e;--border:rgba(0,212,255,.15)}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  nav{padding:12px 24px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,14,23,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
  .nav-logo{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-decoration:none}
  .nav-links{display:flex;gap:24px;align-items:center}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;transition:color .3s}
  .nav-links a:hover,.nav-links a.active{color:var(--cyan)}
  .playground{flex:1;display:flex;overflow:hidden}
  .editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
  .pane-header{padding:10px 16px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .run-btn{padding:6px 16px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .3s}
  .run-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,212,255,.3)}
  .run-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .run-btn.running{background:linear-gradient(135deg,var(--purple),var(--cyan));animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  #editor{flex:1;background:var(--code-bg);color:var(--text);border:none;outline:none;padding:20px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.8;resize:none;tab-size:2}
  #editor::placeholder{color:var(--muted)}
  .output-pane{flex:1;display:flex;flex-direction:column}
  .output-header{display:flex;justify-content:space-between;align-items:center}
  .status-badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
  .status-badge.idle{background:rgba(136,146,166,.1);color:var(--muted)}
  .status-badge.running{background:rgba(0,212,255,.1);color:var(--cyan)}
  .status-badge.success{background:rgba(0,255,136,.1);color:var(--green)}
  .status-badge.error{background:rgba(255,107,107,.1);color:var(--red)}
  #output{flex:1;background:var(--bg2);color:var(--green);padding:20px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8;overflow:auto;white-space:pre-wrap}
  .output-placeholder{color:var(--muted);font-style:italic}
  .output-error{color:var(--red)}
  .examples{display:flex;gap:8px;align-items:center}
  .example-btn{padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .2s}
  .example-btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .shortcut{font-size:10px;color:var(--muted);margin-left:8px}
  @media(max-width:768px){.playground{flex-direction:column}.editor-pane{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">TLL</a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/docs/">文档</a>
    <a href="/playground/" class="active">Playground</a>
    <a href="https://github.com/aliquanhou/tll" target="_blank">GitHub</a>
  </div>
</nav>
<div class="playground">
  <div class="editor-pane">
    <div class="pane-header">
      <span>main.tll</span>
      <div class="examples">
        <button class="example-btn" data-example="hello">Hello</button>
        <button class="example-btn" data-example="math">Math</button>
        <button class="example-btn" data-example="loop">Loop</button>
      </div>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="// 在这里编写 TLL 代码...">fn main() {
    io.println("Hello, TLL Playground!")

    let name = "AI-Native"
    let version = "0.1"

    io.println("Language: TLL " + version)
    io.println("Paradigm: " + name)
}

main()</textarea>
  </div>
  <div class="output-pane">
    <div class="pane-header output-header">
      <span>Output</span>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="status-badge idle" id="statusBadge">Ready</span>
        <button class="run-btn" id="runBtn">▶ Run <span class="shortcut">Ctrl+Enter</span></button>
      </div>
    </div>
    <div id="output"><span class="output-placeholder">// 点击 Run 按钮或按 Ctrl+Enter 运行代码</span></div>
  </div>
</div>
<script>
  const editor = document.getElementById('editor');
  const output = document.getElementById('output');
  const runBtn = document.getElementById('runBtn');
  const statusBadge = document.getElementById('statusBadge');

  const examples = {
    hello: 'fn main() {\n    io.println("Hello, TLL!")\n}\n\nmain()',
    math: 'let x = 1 + 2 * 3\nlet y = (1 + 2) * 3\nio.println("x = " + x)\nio.println("y = " + y)',
    loop: 'mut i = 0\nwhile i < 5 {\n    io.println("count: " + i)\n    i = i + 1\n}'
  };

  function setStatus(status, text) {
    statusBadge.className = 'status-badge ' + status;
    statusBadge.textContent = text;
  }

  async function runCode() {
    const code = editor.value;
    if (!code.trim()) {
      output.innerHTML = '<span class="output-error">// 代码为空</span>';
      return;
    }

    runBtn.disabled = true;
    runBtn.classList.add('running');
    setStatus('running', 'Running...');
    output.textContent = '// 正在执行...';

    const startTime = Date.now();

    try {
      const response = await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      });

      const result = await response.json();
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);

      if (result.ok) {
        setStatus('success', 'OK (' + elapsed + 's)');
        output.textContent = result.output;
      } else {
        setStatus('error', 'Error (' + elapsed + 's)');
        output.innerHTML = '<span class="output-error">' + escapeHtml(result.output) + '</span>';
      }
    } catch (err) {
      setStatus('error', 'Error');
      output.innerHTML = '<span class="output-error">// 请求失败: ' + escapeHtml(err.message) + '\n// 请检查网络连接或稍后重试</span>';
    } finally {
      runBtn.disabled = false;
      runBtn.classList.remove('running');
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  runBtn.addEventListener('click', runCode);

  // Ctrl+Enter shortcut
  editor.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
    // Tab key support
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
    }
  });

  // Example buttons
  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const example = this.getAttribute('data-example');
      if (examples[example]) {
        editor.value = examples[example];
        output.innerHTML = '<span class="output-placeholder">// 点击 Run 按钮或按 Ctrl+Enter 运行代码</span>';
        setStatus('idle', 'Ready');
      }
    });
  });
</script>
</body>
</html>
