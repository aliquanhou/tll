<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLL Language Specification 0.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--cyan:#00d4ff;--purple:#7b2ffc;--green:#00ff88;--bg:#0a0e17;--bg2:#0f1420;--bg3:#1a1f2e;--text:#e8edf5;--muted:#8892a6;--border:rgba(0,212,255,.12);--code-bg:#131722}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 32px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,14,23,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
  .nav-logo{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-decoration:none}
  .nav-links{display:flex;gap:24px;align-items:center}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;transition:color .3s}
  .nav-links a:hover,.nav-links a.active{color:var(--cyan)}
  .layout{display:flex;padding-top:52px;min-height:100vh}
  .sidebar{width:280px;flex-shrink:0;position:fixed;top:52px;left:0;bottom:0;overflow-y:auto;padding:24px 20px;border-right:1px solid var(--border);background:rgba(15,20,32,.6)}
  .sidebar::-webkit-scrollbar{width:4px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .sidebar-title{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .sidebar-nav{list-style:none}
  .sidebar-nav li{margin-bottom:2px}
  .sidebar-nav a{display:block;padding:6px 10px;color:var(--muted);text-decoration:none;font-size:13px;border-radius:6px;transition:all .2s;font-family:'JetBrains Mono',monospace}
  .sidebar-nav a:hover{color:var(--cyan);background:rgba(0,212,255,.05)}
  .sidebar-nav a.h2{padding-left:10px;font-weight:600;color:var(--text)}
  .sidebar-nav a.h3{padding-left:24px;font-size:12px}
  .sidebar-nav a.h4{padding-left:38px;font-size:11px;color:var(--muted)}
  .content{flex:1;margin-left:280px;padding:40px 48px 80px;max-width:900px}
  .content h1{font-size:36px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--text),var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:16px;border-bottom:2px solid var(--border)}
  .content h2{font-size:26px;font-weight:700;margin-top:48px;margin-bottom:16px;color:var(--cyan);padding-bottom:8px;border-bottom:1px solid var(--border)}
  .content h3{font-size:20px;font-weight:600;margin-top:32px;margin-bottom:12px;color:var(--text)}
  .content h4{font-size:16px;font-weight:600;margin-top:24px;margin-bottom:10px;color:var(--muted)}
  .content p{margin-bottom:16px;color:var(--text);font-size:15px}
  .content ul,.content ol{margin-bottom:16px;padding-left:24px}
  .content li{margin-bottom:6px;font-size:14px;color:var(--text)}
  .content code{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--code-bg);padding:2px 6px;border-radius:4px;color:var(--cyan);border:1px solid var(--border)}
  .content pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;overflow-x:auto}
  .content pre code{background:none;border:none;padding:0;color:var(--text);font-size:13px;line-height:1.7}
  .content blockquote{border-left:3px solid var(--purple);padding:12px 20px;margin-bottom:16px;background:rgba(123,47,252,.05);border-radius:0 8px 8px 0;color:var(--muted)}
  .content blockquote p{margin-bottom:4px;color:var(--muted)}
  .content table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px}
  .content th{text-align:left;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);color:var(--cyan);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:13px}
  .content td{padding:10px 14px;border:1px solid var(--border);color:var(--text)}
  .content tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .content hr{border:none;border-top:1px solid var(--border);margin:32px 0}
  .content a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(0,212,255,.3)}
  .content a:hover{border-bottom-color:var(--cyan)}
  .content strong{color:var(--green);font-weight:600}
  .loading{text-align:center;padding:80px;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:1024px){.sidebar{transform:translateX(-100%);transition:transform .3s;z-index:99}.sidebar.open{transform:translateX(0)}.content{margin-left:0;padding:24px 20px}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">TLL</a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/docs/" class="active">文档</a>
    <a href="/playground/">Playground</a>
    <a href="https://github.com/aliquanhou/tll" target="_blank">GitHub</a>
  </div>
</nav>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Specification 0.1</div>
    <ul class="sidebar-nav" id="sidebarNav"></ul>
  </aside>
  <main class="content" id="content">
    <div class="loading"><div class="spinner"></div><div>Loading specification...</div></div>
  </main>
</div>
<script>
function renderMarkdown(md){
  const lines=md.split('\n');
  let html='';
  let inCode=false;
  let codeLang='';
  let codeBuffer=[];
  let inTable=false;
  let tableBuffer=[];
  let inList=false;
  let listType='';
  let listBuffer=[];

  function flushList(){
    if(!inList)return;
    const tag=listType==='ol'?'ol':'ul';
    html+=`<${tag}>`+listBuffer.join('')+`</${tag}>`;
    inList=false;listBuffer=[];
  }
  function flushTable(){
    if(!inTable)return;
    const rows=tableBuffer;
    if(rows.length<2){inTable=false;tableBuffer=[];return}
    const headers=rows[0].split('|').map(s=>s.trim()).filter(Boolean);
    html+='<table><thead><tr>';
    headers.forEach(h=>html+=`<th>${inline(h)}</th>`);
    html+='</tr></thead><tbody>';
    for(let i=2;i<rows.length;i++){
      const cells=rows[i].split('|').map(s=>s.trim()).filter(Boolean);
      html+='<tr>';
      cells.forEach(c=>html+=`<td>${inline(c)}</td>`);
      html+='</tr>';
    }
    html+='</tbody></table>';
    inTable=false;tableBuffer=[];
  }

  function inline(text){
    return text
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  }

  for(let i=0;i<lines.length;i++){
    const line=lines[i];

    if(line.startsWith('```')){
      flushList();flushTable();
      if(!inCode){
        inCode=true;codeLang=line.slice(3).trim();codeBuffer=[];
      }else{
        const lang=codeLang?` class="language-${codeLang}"`:'';
        html+=`<pre><code${lang}>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`;
        inCode=false;codeLang='';codeBuffer=[];
      }
      continue;
    }
    if(inCode){codeBuffer.push(line);continue;}

    if(line.trim().startsWith('|')&&line.trim().endsWith('|')){
      flushList();
      if(!inTable){inTable=true;tableBuffer=[]}
      tableBuffer.push(line.trim());
      continue;
    }else{flushTable()}

    if(line.match(/^\d+\.\s/)){
      if(inList&&listType!=='ol')flushList();
      if(!inList){inList=true;listType='ol'}
      listBuffer.push(`<li>${inline(line.replace(/^\d+\.\s/,''))}</li>`);
      continue;
    }else if(line.match(/^[-*]\s/)){
      if(inList&&listType!=='ul')flushList();
      if(!inList){inList=true;listType='ul'}
      listBuffer.push(`<li>${inline(line.replace(/^[-*]\s/,''))}</li>`);
      continue;
    }else{flushList()}

    if(line.startsWith('> ')){
      html+=`<blockquote><p>${inline(line.slice(2))}</p></blockquote>`;
      continue;
    }
    if(line.match(/^#{1,4}\s/)){
      const level=line.match(/^(#+)/)[1].length;
      const text=line.replace(/^#+\s/,'');
      const id=text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-');
      html+=`<h${level} id="${id}">${inline(text)}</h${level}>`;
      continue;
    }
    if(line.trim()==='---'){html+='<hr>';continue;}
    if(line.trim()===''){continue;}
    html+=`<p>${inline(line)}</p>`;
  }
  flushList();flushTable();
  return html;
}

function escapeHtml(text){
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}

function buildSidebar(content){
  const nav=document.getElementById('sidebarNav');
  const headings=content.querySelectorAll('h2,h3,h4');
  headings.forEach(h=>{
    const li=document.createElement('li');
    const a=document.createElement('a');
    a.href='#'+h.id;
    a.textContent=h.textContent;
    a.className=h.tagName.toLowerCase();
    li.appendChild(a);
    nav.appendChild(li);
  });
}

fetch('0.1.md')
  .then(r=>r.text())
  .then(md=>{
    const content=document.getElementById('content');
    content.innerHTML=renderMarkdown(md);
    buildSidebar(content);
  })
  .catch(err=>{
    document.getElementById('content').innerHTML='<div class="loading">Failed to load specification: '+err.message+'</div>';
  });
</script>
</body>
</html>
